<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="executive-dashboard.css">
  <script>window.__dashboardShell = "executive";</script>
  <script defer src="../../shared/session.js"></script>
  <script defer src="executive-dashboard.js"></script>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-logo">
      <img src="../../logo.png" alt="Logo" class="admin-logo-img">
    </div>

    <nav class="admin-sidebar-nav" id="adminSidebarNav" aria-label="Executive navigation"></nav>

    <div class="admin-sidebar-profile" id="adminSidebarProfile"></div>

    <button id="adminToggleSidebar" class="admin-collapse-btn" type="button" aria-label="Toggle sidebar">
      <i class="ri-arrow-left-s-line"></i>
    </button>
  </aside>

  <main class="main">
    <div id="mainContent"></div>
  </main>
</div>

</body>
</html>
